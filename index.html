<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mvirt</title>
<meta name="description" content="Something is spinning up.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23a855f7'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-family='system-ui' font-size='55' font-weight='800' fill='white' text-anchor='middle'%3Em%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a0a0f;
    --fg: #f0f0f5;
    --dim: #9090a0;
    --accent: #818cf8;
    --purple: #a855f7;
    --blue: #3b82f6;
    --grid: rgba(129, 140, 248, 0.05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* subtle background grid */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, #000 30%, transparent 75%);
    pointer-events: none;
  }
  main {
    text-align: center;
    padding: 2rem;
    animation: fadein 1.2s ease both;
    position: relative;
  }
  h1 {
    font-size: clamp(3rem, 12vw, 6.5rem);
    font-weight: 600;
    letter-spacing: -0.04em;
    color: var(--fg);
  }
  h1 .v {
    background: linear-gradient(135deg, var(--purple), var(--blue));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .status {
    margin-top: 1.5rem;
    font-size: clamp(0.85rem, 2.5vw, 1rem);
    color: var(--dim);
  }
  .status .dot {
    display: inline-block;
    width: 0.55em;
    height: 0.55em;
    border-radius: 50%;
    background: var(--accent);
    margin-right: 0.6em;
    vertical-align: baseline;
    animation: pulse 2.4s ease-in-out infinite;
  }
  .cursor {
    display: inline-block;
    width: 0.55em;
    height: 1.1em;
    background: var(--accent);
    margin-left: 0.15em;
    vertical-align: text-bottom;
    animation: blink 1.1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(129, 140, 248, 0.5); }
    50% { box-shadow: 0 0 0 0.5em rgba(129, 140, 248, 0); }
  }
  @keyframes fadein {
    from { opacity: 0; transform: translateY(0.5rem); }
  }
  @media (prefers-reduced-motion: reduce) {
    .dot, .cursor { animation: none; }
    main { animation: none; }
  }
</style>
</head>
<body>
<main>
  <h1>m<span class="v">virt</span></h1>
  <p class="status"><span class="dot"></span>something is spinning up<span class="cursor"></span></p>
</main>
</body>
</html>
