<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mvirt</title>
<meta name="description" content="Something is spinning up.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23a855f7'/%3E%3Cstop offset='100%25' stop-color='%233b82f6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='20' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-family='system-ui' font-size='55' font-weight='800' fill='white' text-anchor='middle'%3Em%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --border: #2a2a3a;
    --text: #f0f0f5;
    --muted: #9090a0;
    --purple: #a855f7;
    --blue: #3b82f6;
    --cyan: #22d3ee;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  ::selection { background: rgba(129, 140, 248, 0.35); }

  /* ambient glows — same fields as the old site's bg-gradient */
  .glow {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 20% 40%, rgba(168, 85, 247, 0.15), transparent),
      radial-gradient(ellipse 60% 40% at 80% 20%, rgba(99, 102, 241, 0.10), transparent),
      radial-gradient(ellipse 50% 30% at 50% 80%, rgba(34, 211, 238, 0.08), transparent);
    pointer-events: none;
    animation: glow-in 1.6s var(--ease-out) both, breathe 14s ease-in-out 1.6s infinite;
  }

  main {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.75rem;
    padding: 2rem;
    text-align: center;
  }

  .mark {
    width: clamp(56px, 12vw, 76px);
    height: auto;
    border-radius: 20%;
    box-shadow:
      0 8px 30px -6px rgba(168, 85, 247, 0.4),
      0 2px 8px -2px rgba(59, 130, 246, 0.3);
    animation: scale-in 0.5s var(--ease-out) 0.1s both;
  }

  h1 {
    font-size: clamp(2.75rem, 10vw, 4.5rem);
    font-weight: 800;
    letter-spacing: -0.045em;
    line-height: 1;
    animation: slide-up 0.6s var(--ease-out) 0.3s both;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.55em;
    padding: 0.5em 1em;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--muted);
    background: rgba(18, 18, 26, 0.8);
    border: 1px solid var(--border);
    border-radius: 9999px;
    animation: slide-up 0.6s var(--ease-out) 0.55s both;
  }
  .pill .dot {
    width: 0.5em;
    height: 0.5em;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px rgba(34, 211, 238, 0.6);
    animation: pulse-dot 1.3s ease-in-out infinite;
  }

  @keyframes glow-in { from { opacity: 0; } }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  @keyframes scale-in {
    from { opacity: 0; transform: scale(0.97); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes slide-up {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  @media (prefers-reduced-motion: reduce) {
    .glow, .mark, h1, .pill, .pill .dot { animation: none; }
  }
</style>
</head>
<body>
<div class="glow" aria-hidden="true"></div>
<main>
  <svg class="mark" viewBox="0 0 100 100" role="img" aria-label="mvirt logo">
    <defs>
      <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#a855f7"/>
        <stop offset="100%" stop-color="#3b82f6"/>
      </linearGradient>
    </defs>
    <rect width="100" height="100" rx="20" fill="url(#g)"/>
    <text x="50" y="68" font-family="Inter, system-ui" font-size="55" font-weight="800" fill="white" text-anchor="middle">m</text>
  </svg>
  <h1>mvirt</h1>
  <p class="pill"><span class="dot" aria-hidden="true"></span>something is spinning up</p>
</main>
</body>
</html>
